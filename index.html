<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Laboratorio AR - UAZ</title>
  
  <!-- Importamos A-Frame (El Motor 3D basado en WebGL) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  
  <!-- Importamos AR.js (El Motor de rastreo que resuelve el registro espacial) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<!-- Evitamos margenes y scroll para que la camara sea inmersiva -->
<body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: False;"
        <a-marker preset="hiro">
            <a-box position="0,0,5,0"material="color: #002855"
            animation="property: rotation; to:0 360 0; loop:true; dur: 3000">
            </a-box>
            <a-sphere position="0 1.5 0" radius="0.3" material="color: #C69214;">
        </a-box>
        </a-marker>
        <a-entity camera>
        </a-entity>
    </a-scene>
</body>
